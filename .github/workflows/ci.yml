name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black flake8 mypy pytest pytest-asyncio httpx

      - name: Enforce Formatting (Black)
        run: |
          black --check app/ tests/

      - name: Strict Linting (Flake8)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 app/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings, but we want strict adherence here.
          flake8 app/ tests/ --count --max-complexity=10 --max-line-length=88 --statistics

      - name: Type Checking (MyPy)
        run: |
          mypy app/ tests/ --ignore-missing-imports --disallow-untyped-defs

      - name: Run Test Suite (Pytest)
        env:
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          pytest tests/ -v --asyncio-mode=auto
